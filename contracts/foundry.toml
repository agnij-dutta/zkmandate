[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 1
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
lint_on_build = false

[fmt]
# Generated by `bb write_solidity_verifier` (scripts/build.sh); keep it byte-identical to bb's output.
ignore = ["src/HonkVerifier.sol"]
line_length = 120
